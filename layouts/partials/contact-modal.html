<div class="modal-overlay hidden" id="contact-modal" aria-hidden="true" role="dialog">
  <div class="modal-container">
    <button class="modal-close" id="close-modal" aria-label="Close Modal">&times;</button>
    
    <div class="modal-header-content">
      <h2>Quick Inquiry</h2>
      <p>Tell us about your metal fabrication or welding project. We'll get back to you shortly.</p>
    </div>
    
    <form action="https://api.web3forms.com/submit" method="POST" id="inquiry-form">
      <input type="hidden" name="access_key" value="{{ .Site.Params.web3forms_key }}">
      <input type="hidden" name="subject" value="New Inquiry from WeldWork site">
      <input type="hidden" name="from_name" value="WeldWork">
      
      <div class="form-group">
        <label for="input-name">Name</label>
        <input type="text" id="input-name" name="name" required placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label for="input-email">Email</label>
        <input type="email" id="input-email" name="email" required placeholder="john@example.com">
      </div>
      
      <div class="form-group">
        <label for="input-message">Message</label>
        <textarea id="input-message" name="message" required placeholder="Describe your project or repair service needs..."></textarea>
      </div>
      
      <div class="form-group captcha-group">
        <div id="turnstile-widget"></div>
      </div>
      
      <div class="form-feedback hidden" id="form-feedback"></div>
      
      <button type="submit" class="submit-button" id="submit-btn">Send Message</button>
    </form>
  </div>
</div>

<link rel="preconnect" href="https://challenges.cloudflare.com" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
