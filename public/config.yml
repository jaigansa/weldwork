backend:
  name: test-repo

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "catalogue_en"
    label: "Catalogue Products (English)"
    folder: "src/content/catalogue/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Partner Company Slug", name: "company", widget: "string" }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Labour Rate Amount (e.g. ₹4,500)", name: "rate", widget: "string" }
      - { label: "Rate Unit / Type", name: "rate_type", widget: "string" }
      - { label: "Rate Effective Date", name: "rate_date", widget: "string" }
      - { label: "Lead Time", name: "lead_time", widget: "string" }
      - { label: "Materials Supported", name: "materials", widget: "list" }
      - { label: "Certifications", name: "certifications", widget: "list", required: false }
      - { label: "Assigned Team Members", name: "teams", widget: "list", required: false }
      - { label: "Product Feature Images", name: "images", widget: "list", field: { label: "Image Path", name: "image", widget: "image" } }
      - { label: "YouTube Video ID (Optional)", name: "youtube_url", widget: "string", required: false }
      - { label: "Product Brief Description", name: "body", widget: "markdown" }

  - name: "catalogue_ta"
    label: "Catalogue Products (Tamil)"
    folder: "src/content/catalogue/ta"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Partner Company Slug", name: "company", widget: "string" }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Labour Rate Amount", name: "rate", widget: "string" }
      - { label: "Rate Unit / Type", name: "rate_type", widget: "string" }
      - { label: "Rate Effective Date", name: "rate_date", widget: "string" }
      - { label: "Lead Time", name: "lead_time", widget: "string" }
      - { label: "Materials Supported", name: "materials", widget: "list" }
      - { label: "Certifications", name: "certifications", widget: "list", required: false }
      - { label: "Assigned Team Members", name: "teams", widget: "list", required: false }
      - { label: "Product Feature Images", name: "images", widget: "list", field: { label: "Image Path", name: "image", widget: "image" } }
      - { label: "YouTube Video ID (Optional)", name: "youtube_url", widget: "string", required: false }
      - { label: "Product Brief Description", name: "body", widget: "markdown" }

  - name: "teams_en"
    label: "Team Members (English)"
    folder: "src/content/teams/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Years Experience Badge", name: "experience", widget: "string" }
      - { label: "Key Skills & Expertise", name: "skills", widget: "string" }
      - { label: "Phone Number", name: "phone", widget: "string" }
      - { label: "Phone Clean (Digits Only)", name: "phone_clean", widget: "string" }
      - { label: "WhatsApp Number (Digits Only)", name: "whatsapp", widget: "string" }
      - { label: "Email Address", name: "email", widget: "string", required: false }
      - { label: "Personal Website", name: "website", widget: "string", required: false }
      - { label: "YouTube Profile URL", name: "youtube", widget: "string", required: false }
      - { label: "Instagram Handle URL", name: "instagram", widget: "string", required: false }
      - { label: "Worker Bio & Profile Summary", name: "body", widget: "markdown" }

  - name: "teams_ta"
    label: "Team Members (Tamil)"
    folder: "src/content/teams/ta"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Years Experience Badge", name: "experience", widget: "string" }
      - { label: "Key Skills & Expertise", name: "skills", widget: "string" }
      - { label: "Phone Number", name: "phone", widget: "string" }
      - { label: "Phone Clean (Digits Only)", name: "phone_clean", widget: "string" }
      - { label: "WhatsApp Number (Digits Only)", name: "whatsapp", widget: "string" }
      - { label: "Email Address", name: "email", widget: "string", required: false }
      - { label: "Personal Website", name: "website", widget: "string", required: false }
      - { label: "YouTube Profile URL", name: "youtube", widget: "string", required: false }
      - { label: "Instagram Handle URL", name: "instagram", widget: "string", required: false }
      - { label: "Worker Bio & Profile Summary", name: "body", widget: "markdown" }

  - name: "company_en"
    label: "Shops & Companies (English)"
    folder: "src/content/company/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Company Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string", required: false }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Logo Icon", name: "logo", widget: "image" }
      - { label: "Background Hero Image", name: "bg_image", widget: "image" }
      - { label: "Phone Number", name: "phone", widget: "string" }
      - { label: "Phone Clean (Digits Only)", name: "phone_clean", widget: "string" }
      - { label: "WhatsApp Number (Digits Only)", name: "whatsapp", widget: "string" }
      - { label: "Email Address", name: "email", widget: "string" }
      - { label: "Full Physical Address", name: "address", widget: "string" }
      - { label: "Latitude", name: "latitude", widget: "number", value_type: "float" }
      - { label: "Longitude", name: "longitude", widget: "number", value_type: "float" }
      - { label: "Company Overview", name: "body", widget: "markdown" }

  - name: "company_ta"
    label: "Shops & Companies (Tamil)"
    folder: "src/content/company/ta"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Company Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string", required: false }
      - { label: "Display Weight (Order)", name: "weight", widget: "number", default: 1 }
      - { label: "Logo Icon", name: "logo", widget: "image" }
      - { label: "Background Hero Image", name: "bg_image", widget: "image" }
      - { label: "Phone Number", name: "phone", widget: "string" }
      - { label: "Phone Clean (Digits Only)", name: "phone_clean", widget: "string" }
      - { label: "WhatsApp Number (Digits Only)", name: "whatsapp", widget: "string" }
      - { label: "Email Address", name: "email", widget: "string" }
      - { label: "Full Physical Address", name: "address", widget: "string" }
      - { label: "Latitude", name: "latitude", widget: "number", value_type: "float" }
      - { label: "Longitude", name: "longitude", widget: "number", value_type: "float" }
      - { label: "Company Overview", name: "body", widget: "markdown" }
